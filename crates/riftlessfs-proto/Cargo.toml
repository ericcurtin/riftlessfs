[package]
name = "riftlessfs-proto"
description = "Portable vhost-user / virtio-fs wire protocol implementation for riftlessfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
riftlessfs-core = { path = "../riftlessfs-core" }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
# vhost-user is a UNIX-domain-socket protocol that relies on SCM_RIGHTS
# ancillary-data fd passing (for shared memory + doorbell fds), which
# doesn't exist on Windows sockets -- see the workspace README. `sendfd`
# wraps the sendmsg/recvmsg + CMSG boilerplate portably across Linux and
# macOS so we don't have to hand-roll it (verified working on both in
# development).
sendfd = "0.4"
