name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: windows-x86_64
            os: windows-latest
          - name: windows-aarch64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      # riftlessfs-core's real filesystem engine only compiles on Unix
      # hosts today (see PASSTHROUGH_SUPPORTED / the workspace README);
      # its integration test file is `#![cfg(unix)]`-gated so it still
      # builds (as an empty test binary) and runs (0 tests) on Windows.
      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  bench-smoke:
    name: bench-smoke (macos-aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Not a perf gate (shared CI runners are too noisy for that) -- just
      # makes sure the benchmark harness itself keeps compiling and running
      # to completion.
      - name: cargo bench --no-run, then a short real run
        run: |
          cargo bench -p riftlessfs-bench --bench core_ops --no-run
          cargo bench -p riftlessfs-bench --bench core_ops -- --measurement-time 1 --warm-up-time 1 --sample-size 10

  qemu-integration:
    name: qemu-integration (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # This boots a real Fedora 44 guest under QEMU and mounts riftlessfsd
    # as a real vhost-user-fs backend (see the README's "How this was
    # actually verified" section) -- it's slow, especially without KVM
    # (GitHub-hosted runners generally don't expose /dev/kvm, so this
    # mostly runs under software emulation), so it gets a generous timeout
    # and runs independently of the fast build-and-test matrix above.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU + UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 genisoimage
      - name: Cache Fedora cloud image
        uses: actions/cache@v4
        with:
          path: ~/.cache/riftlessfs-qemu-test
          key: fedora-cloud-44-${{ matrix.name }}
      - name: Run QEMU integration test
        run: ./scripts/qemu-integration-test.sh
